[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flet-code-editor-dsl"
version = "0.1.0"
description = "A real Flutter code editor exposed as a Flet control"
requires-python = ">=3.10"
dependencies = ["flet"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flutter.flet_code_editor_dsl" = ["pubspec.yaml", "lib/**/*"]
